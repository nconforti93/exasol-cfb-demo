# Integration-test load plan variant (deployed into the TEST_ namespace by tests/it/harness.py).
# Default settings; the tests set the date with Harness.set_now. Entry order is the ENTRY_ID.
version: 1
# Both profiles, and a gated full entry (GAMES_WEATHER needs the `weather` API feature).
# At 2020-10-20: demo GAMES 2017-2020 (4 slices), full-only RATINGS_SP 2019-2020 (2 slices).
entries:
  - table: GAMES
    profile: demo
    priority: 2
    slicing: season
    seasons: {from: 2017}
    refresh_class: weekly
  - table: RATINGS_SP
    profile: full
    priority: 1
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
  - table: GAMES_WEATHER
    profile: full
    priority: 3
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
