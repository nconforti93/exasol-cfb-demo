# Integration-test load plan variant (deployed into the TEST_ namespace by tests/it/harness.py).
# Default settings; the tests set the date with Harness.set_now. Entry order is the ENTRY_ID.
version: 1
# Slices without a season (none, season_range) next to season slices, all with priority 1.
entries:
  - table: TEAMS
    profile: demo
    priority: 1
    slicing: none
    refresh_class: static
  - table: CONFERENCES_AFFILIATIONS
    profile: demo
    priority: 1
    slicing: season_range
    seasons: {from: 1869, to: 2019}
    refresh_class: static
  - table: GAMES
    profile: demo
    priority: 1
    slicing: season
    seasons: {from: 2017}
    refresh_class: weekly
