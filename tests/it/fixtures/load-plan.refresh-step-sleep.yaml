# Integration-test load plan variant (deployed into the TEST_ namespace by tests/it/harness.py).
# Default settings; the tests set the date with Harness.set_now. Entry order is the ENTRY_ID.
version: 1
# Weekly refresh scenarios: GAMES and RATINGS_SP weekly, TEAMS and CALENDAR static, from 2019.
# Registered steps (TEST_STEP_* scripts are created by the harness): refresh-step-sleep.
refresh_steps:
  - {step_no: 100, name: MODEL, script: TEST_CFB_INFRA.TEST_STEP_SLEEP}
entries:
  - table: TEAMS
    profile: demo
    priority: 1
    slicing: none
    refresh_class: static
  - table: CALENDAR
    profile: demo
    priority: 2
    slicing: season
    seasons: {from: 2019}
    refresh_class: static
  - table: GAMES
    profile: demo
    priority: 3
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
  - table: RATINGS_SP
    profile: demo
    priority: 4
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
