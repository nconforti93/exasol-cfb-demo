# Integration-test load plan variant (deployed into the TEST_ namespace by tests/it/harness.py).
# Default settings; the tests set the date with Harness.set_now. Entry order is the ENTRY_ID.
version: 1
# GAMES and RATINGS_SP with the same priority: they load season by season.
entries:
  - table: GAMES
    profile: demo
    priority: 1
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
  - table: RATINGS_SP
    profile: demo
    priority: 1
    slicing: season
    seasons: {from: 2019}
    refresh_class: weekly
