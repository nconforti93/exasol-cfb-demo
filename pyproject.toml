[project]
name = "exasol-cfb-demo"
version = "0.1.0"
description = "College football analytics platform on Exasol: OpenAPI-generated CFBD Virtual Schema"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "PyYAML>=6",
    "types-PyYAML>=6",
    "pyexasol>=2,<3",
    "httpx==0.28.1",
]
app = [
    "fastapi==0.143.2",
    "starlette==1.8.0",
    "uvicorn==0.54.0",
]
chat = [
    "anthropic>=1.15,<2",
]

[tool.uv]
package = false
default-groups = ["dev", "app", "chat"]
# 7-day rule (decision [18]): the newest release at least 7 days old on 2026-10-23, per package.
exclude-newer-package = { anthropic = "2026-10-16T01:00:00Z", httpx2 = "2026-10-16T01:00:00Z", httpcore2 = "2026-10-16T01:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/cli"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "it: integration test against Exasol Personal local (replay mode)",
    "network: needs HTTPS egress to the DoH endpoint (no CFBD call); not part of `make test-it`",
    "e2e: browser smoke of the built app against the TEST_ stack (`make app-e2e`); not part of `make test-it`",
]

[tool.coverage.run]
source = ["vs/cfbd_vs", "vs/gen", "app/backend"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vs/openapi", "cache", "build", "spikes", "node_modules", "app/frontend", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vs", "scripts", "tests", "app/__init__.py", "app/backend"]
mypy_path = "."
explicit_package_bases = true
