# Caps of the live-call ledger (vs/host/ledger.py). Edited by the owner only.
#
# plans:  calls a plan may spend over all months. A plan that is not listed is refused.
# months: calls the whole key may spend in a calendar month (UTC), across all plans: the owner's
#         authorization. A month without an entry refuses live calls until the owner adds one,
#         for example "2026-11": 200 once the November budget is chosen.
plans:
  add-cfbd-vs-foundation: 50
  add-cfb-persistence-refresh: 300
  add-cfb-analyses: 6       # orchestrator sub-allocation within the owner's monthly caps (2026-10-22)
  add-cfb-app: 12
  add-cfb-demo-hardening: 70
  app: 60                   # runtime app/demo spend (previews, console, refresh button)
months:
  "2026-10": 400
  "2026-11": 1000  # owner authorized 2026-10-22
